[project]
name = "neuroview-backend"
version = "1.0.0"
description = "FastAPI inference server for NeuroScan AI - accepts raw voxel buffers and returns NIfTI segmentation masks"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.48.0",
    "python-multipart==0.0.30",
    "nibabel==5.4.2",
    "torch==2.12.0",
    "numpy==2.4.6",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
]

[project.scripts]
neuroview = "main:main"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"
